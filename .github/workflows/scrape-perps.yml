name: Scrape DefiLlama Perps

on:
  schedule:
    # Runs daily at 12:01 AM PST (covers PDT too — GitHub Actions uses UTC
    # and doesn't honor DST, so we fire at both 07:01 UTC and 08:01 UTC).
    # DefiLlama rolls over its daily totals at 00:00 PST, so waiting a minute
    # picks up the fresh numbers. The no-op commit check prevents dupes when
    # the second run sees unchanged data.
    - cron: '1 7,8 * * *'
  workflow_dispatch: {}

permissions: write-all

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Scrape DefiLlama
        run: node scripts/scrape-perps.mjs

      - name: Commit updated snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/perps.json public/data/perps.js
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh perps snapshot"
          # Retry with rebase in case main advanced during the scrape (common
          # when a human commit lands mid-run — the push would otherwise be
          # rejected as non-fast-forward).
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt, rebasing onto origin/main…"
            git pull --rebase origin main
          done
          echo "All push attempts failed." >&2
          exit 1
