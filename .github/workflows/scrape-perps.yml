name: Scrape DefiLlama Perps

on:
  schedule:
    # Every 2 hours at :01 (UTC). 12 runs/day: 00:01, 02:01, 04:01, 06:01,
    # 08:01, 10:01, 12:01, 14:01, 16:01, 18:01, 20:01, 22:01. Commits are
    # no-op'd via `git diff --staged --quiet` when DefiLlama hasn't moved.
    - cron: '1 */2 * * *'
  workflow_dispatch: {}

permissions: write-all

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Scrape DefiLlama
        run: node scripts/scrape-perps.mjs

      - name: Commit updated snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/perps.json public/data/perps.js
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh perps snapshot"
          # Retry with rebase in case main advanced during the scrape (common
          # when a human commit lands mid-run — the push would otherwise be
          # rejected as non-fast-forward).
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt, rebasing onto origin/main…"
            git pull --rebase origin main
          done
          echo "All push attempts failed." >&2
          exit 1
