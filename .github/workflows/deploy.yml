name: Deploy to Vercel

# Deploys the current commit on main to Vercel production. Fires on any push
# to main (scraper data updates, manual code changes) and is also manually
# runnable from the Actions tab.

on:
  push:
    branches: [main]
    # Skip when only the scraper's data files change — the scrape-perps workflow
    # already handles deploys for those commits, avoiding duplicate builds.
    paths-ignore:
      - 'public/data/perps.json'
      - 'public/data/perps.js'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --prebuilt --token="$VERCEL_TOKEN"
